<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چرتکه | مدیریت مالی خانواده</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;font-family:Tahoma,Arial;color:#263248}
header{background:#183b56;color:white;padding:24px 18px;border-radius:0 0 22px 22px}
header h1{margin:0 0 8px;font-size:25px}
header p{margin:0;color:#d5e5f1;font-size:13px}
.container{padding:16px;max-width:650px;margin:auto}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:white;padding:17px;border-radius:15px;box-shadow:0 2px 8px #0000000b}
.card small{color:#788397}
.card strong{display:block;font-size:19px;margin-top:12px}
.balance{grid-column:span 2;background:#e4f1f8}
.green{color:#168451}
.red{color:#d34c4c}
h3{margin-top:25px}
form,.box{background:white;padding:17px;border-radius:15px;margin-top:12px}
input,select,button{width:100%;padding:13px;margin-top:10px;border:1px solid #dce1e9;border-radius:9px;font-family:inherit;font-size:14px}
button{background:#183b56;color:white;border:0;cursor:pointer}
button.secondary{background:#e8eef4;color:#183b56}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:white;padding:14px;margin-top:9px;border-radius:12px;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.item small{display:block;color:#788397;margin-top:7px}
.actions{display:flex;gap:8px;margin-top:15px}
.actions button{flex:1}
footer{text-align:center;color:#8792a3;font-size:11px;padding:25px}
</style>
</head>
<body>

<header>
<h1>🧮 چرتکه</h1>
<p>مدیریت درآمد و هزینه خانواده</p>
</header>

<div class="container">

<div class="cards">
<div class="card balance">
<small>موجودی کل</small>
<strong id="balance">۰ تومان</strong>
</div>
<div class="card">
<small>مجموع درآمد</small>
<strong class="green" id="income">۰</strong>
</div>
<div class="card">
<small>مجموع هزینه</small>
<strong class="red" id="expense">۰</strong>
</div>
</div>

<h3>ثبت تراکنش جدید</h3>

<form id="form">
<select id="type">
<option value="income">درآمد</option>
<option value="expense">هزینه</option>
</select>

<input id="amount" type="number" min="1" placeholder="مبلغ به تومان" required>

<input id="title" type="text" placeholder="شرح تراکنش" required>

<select id="category">
<option>حقوق</option>
<option>خوراک</option>
<option>حمل و نقل</option>
<option>قبوض</option>
<option>درمان</option>
<option>آموزش</option>
<option>خرید</option>
<option>تفریح</option>
<option>سایر</option>
</select>

<input id="date" type="date" required>

<button type="submit">ثبت تراکنش</button>
</form>

<h3>تراکنش‌های اخیر</h3>
<div id="transactions"></div>

<h3>پشتیبان‌گیری اطلاعات</h3>
<div class="box">
<p style="font-size:13px;line-height:2">
برای حفظ اطلاعات، می‌توانی از داده‌ها نسخه پشتیبان تهیه کنی.
</p>
<button onclick="backup()">دریافت نسخه پشتیبان</button>
<button class="secondary" onclick="document.getElementById('restore').click()">بازیابی نسخه پشتیبان</button>
<input id="restore" type="file" accept=".json" hidden>
</div>

<footer>چرتکه | نسخه 1.1</footer>

</div>

<script>
const KEY = "chortkeh_database";
const VERSION = 2;
let storageReady = true;

function emptyDB(){
 return {version:VERSION, transactions:[], categories:["حقوق","خوراک","حمل و نقل","قبوض","درمان","آموزش","خرید","تفریح","سایر"]};
}

function validTransaction(t){
 return !!t && ["income","expense"].includes(t.type) &&
  Number.isSafeInteger(t.amount) && t.amount>0 &&
  typeof t.title==="string" && typeof t.category==="string" &&
  typeof t.date==="string" && /^\d{4}-\d{2}-\d{2}$/.test(t.date);
}

function migrateDB(oldDB){
 if(!oldDB || !Array.isArray(oldDB.transactions) ||
    !oldDB.transactions.every(validTransaction)) throw new Error("ساختار اطلاعات معتبر نیست");
 if(!Number.isInteger(oldDB.version) || oldDB.version>VERSION || oldDB.version<1)
  throw new Error("نسخه اطلاعات پشتیبانی نمی‌شود");
 // نسخه ۱ فقط تراکنش‌ها را داشت؛ داده‌ها بدون حذف یا تغییر منتقل می‌شوند.
 const migrated={...oldDB,version:VERSION,transactions:oldDB.transactions.map(t=>({
  id:typeof t.id==="string" && t.id ? t.id : crypto.randomUUID(),
  type:t.type, amount:t.amount, title:t.title, category:t.category, date:t.date
 }))};
 migrated.categories=Array.isArray(oldDB.categories)?oldDB.categories:emptyDB().categories;
 return migrated;
}

function loadDB(){
 const raw=localStorage.getItem(KEY);
 if(raw===null) return emptyDB();
 try{
  const parsed=JSON.parse(raw);
  return migrateDB(parsed);
 }catch(err){
  storageReady=false;
  showStorageError("اطلاعات ذخیره‌شده قابل خواندن یا تبدیل نیست. برای جلوگیری از پاک‌شدن داده‌ها، ثبت و ذخیره غیرفعال شده است. ابتدا از داده خام نسخه پشتیبان بگیرید.");
  return emptyDB();
 }
}

function showStorageError(message){
 const box=document.createElement("div");
 box.id="storageError";
 box.style.cssText="background:#fff0f0;color:#9b2525;padding:14px;margin:14px 16px;border-radius:12px;line-height:2;font-size:13px";
 box.textContent=message;
 document.querySelector(".container").prepend(box);
 const form=document.getElementById("form");
 if(form) form.querySelectorAll("input,select,button").forEach(el=>el.disabled=true);
}

let db=loadDB();

function saveDB(){
 if(!storageReady) throw new Error("ذخیره‌سازی به دلیل خطای اطلاعات غیرفعال است");
 db.version=VERSION;
 localStorage.setItem(KEY,JSON.stringify(db));
}

const money=n=>new Intl.NumberFormat('fa-IR').format(n)+" تومان";

function render(){
 let inc=0,exp=0;
 db.transactions.forEach(t=>{ if(t.type==="income") inc+=t.amount; else exp+=t.amount; });
 document.getElementById("income").textContent=money(inc);
 document.getElementById("expense").textContent=money(exp);
 document.getElementById("balance").textContent=money(inc-exp);
 const list=document.getElementById("transactions");
 list.innerHTML="";
 [...db.transactions].reverse().forEach(t=>{
  const div=document.createElement("div"); div.className="item";
  const info=document.createElement("div");
  const name=document.createElement("b"); name.textContent=t.title;
  const details=document.createElement("small"); details.textContent=t.category+" | "+t.date;
  info.append(name,details);
  const amount=document.createElement("b"); amount.className=t.type==="income"?"green":"red";
  amount.textContent=(t.type==="income"?"+":"-")+money(t.amount);
  div.append(info,amount); list.appendChild(div);
 });
 if(!db.transactions.length) list.textContent="هنوز تراکنشی ثبت نشده است.";
}

document.getElementById("date").value=new Date().toISOString().slice(0,10);
document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault(); if(!storageReady) return;
 const amount=Number(document.getElementById("amount").value);
 const title=document.getElementById("title").value.trim();
 if(!Number.isSafeInteger(amount)||amount<=0){alert("مبلغ معتبر وارد کن");return;}
 if(!title){alert("شرح تراکنش را وارد کن");return;}
 db.transactions.push({id:crypto.randomUUID(),type:document.getElementById("type").value,amount,title,category:document.getElementById("category").value,date:document.getElementById("date").value});
 try{saveDB();}catch(err){alert("ذخیره اطلاعات ناموفق بود: "+err.message);return;}
 e.target.reset(); document.getElementById("date").value=new Date().toISOString().slice(0,10); render();
});

function downloadText(filename,text,mime){
 const blob=new Blob([text],{type:mime}); const url=URL.createObjectURL(blob);
 const a=document.createElement("a"); a.href=url; a.download=filename; a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function backup(){
 const raw=localStorage.getItem(KEY);
 if(raw===null){alert("هنوز اطلاعاتی برای پشتیبان‌گیری وجود ندارد.");return;}
 downloadText("chortkeh-backup-v"+VERSION+".json",raw,"application/json");
}

// در صورت خرابی ساختار، امکان نجات داده خام بدون دست‌کاری آن فراهم است.
if(!storageReady){
 const rescue=document.createElement("button"); rescue.className="secondary";
 rescue.textContent="دریافت نسخه خام اطلاعات ذخیره‌شده";
 rescue.onclick=()=>downloadText("chortkeh-raw-recovery.txt",localStorage.getItem(KEY)||"","text/plain");
 document.querySelector("#storageError").appendChild(rescue);
}

document.getElementById("restore").addEventListener("change",async e=>{
 const file=e.target.files[0]; if(!file)return;
 try{
  const restored=migrateDB(JSON.parse(await file.text()));
  if(confirm("اطلاعات فعلی با نسخه پشتیبان جایگزین شود؟ پیشنهاد می‌شود ابتدا از اطلاعات فعلی نسخه پشتیبان بگیرید.")){
   // پیش از جایگزینی، نسخه فعلی در حافظه مرورگر برای بازگشت نگه داشته می‌شود.
   const current=localStorage.getItem(KEY);
   if(current!==null) localStorage.setItem(KEY+"_before_restore_"+Date.now(),current);
   localStorage.setItem(KEY,JSON.stringify(restored)); db=restored; storageReady=true;
   document.getElementById("storageError")?.remove();
   document.getElementById("form").querySelectorAll("input,select,button").forEach(el=>el.disabled=false);
   render(); alert("بازیابی انجام شد");
  }
 }catch(err){alert("فایل پشتیبان معتبر یا قابل پشتیبانی نیست. اطلاعات فعلی تغییر نکرد.");}
 e.target.value="";
});

// ثبت نسخه مهاجرت‌شده تنها پس از تبدیل موفق انجام می‌شود.
if(storageReady){
 try{saveDB();}catch(err){storageReady=false;showStorageError("ذخیره نسخه جدید ناموفق بود؛ اطلاعات قبلی دست‌نخورده باقی مانده است.");}
}
render();
</script>

</body>
</html>
